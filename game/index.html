<!DOCTYPE html>

<head>

<title>CINDERLINE YARD — 5v5 Tactical FPS</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#1a1410; font-family:Arial,Helvetica,sans-serif; color:#e8e2d4; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .vignette { position:fixed; inset:0; pointer-events:none; z-index:5;
    background:radial-gradient(ellipse at center, transparent 58%, rgba(10,6,4,.42) 100%); }
  .hidden { display:none !important; }
  .hud { position:fixed; inset:0; pointer-events:none; z-index:10; --ch:6px; }
  /* top bar */
  .topbar { position:absolute; top:12px; left:50%; transform:translateX(-50%); display:flex; gap:8px; align-items:stretch; }
  .tb-team { display:flex; align-items:center; gap:8px; background:rgba(12,14,18,.72); border:1px solid rgba(255,255,255,.14); padding:6px 12px; border-radius:4px; }
  .tb-name { font-weight:900; font-size:13px; letter-spacing:1px; }
  .ember .tb-name, .tb-team.ember .tb-name { color:#ff9a4d; }
  .tb-team.slate .tb-name { color:#7fb8e8; }
  .tb-score { font-size:22px; font-weight:900; }
  .tb-pips { display:flex; gap:3px; }
  .tb-pips i { width:7px; height:14px; background:rgba(255,255,255,.18); display:block; }
  .tb-pips i.on.ember { background:#ff9a4d; } .tb-pips i.on.slate { background:#7fb8e8; }
  .tb-mid { background:rgba(12,14,18,.72); border:1px solid rgba(255,255,255,.14); padding:4px 16px; border-radius:4px; text-align:center; min-width:170px; }
  .tb-time { font-size:20px; font-weight:900; line-height:1; }
  .tb-round { font-size:10px; letter-spacing:1px; color:#cbb98f; }
  .tb-obj { font-size:10px; letter-spacing:1px; color:#ffb224; font-weight:700; }
  /* minimap */
  .minimap { position:absolute; top:12px; left:12px; width:176px; height:176px; border:2px solid rgba(255,255,255,.4); border-radius:50%; overflow:hidden; background:rgba(10,12,14,.85); box-shadow:0 0 0 3px rgba(0,0,0,.45), 0 2px 14px rgba(0,0,0,.5); }
  .minimap canvas { display:block; }
  .mm-label { position:absolute; top:194px; left:12px; width:176px; text-align:center; font-size:10px; letter-spacing:2px; padding:3px 0; background:rgba(0,0,0,.55); color:#d8cdb4; }
  /* killfeed */
  .killfeed { position:absolute; top:12px; right:12px; display:flex; flex-direction:column; gap:5px; align-items:flex-end; }
  .kf { background:rgba(12,14,18,.78); border:1px solid rgba(255,255,255,.14); padding:5px 10px; border-radius:3px; font-size:13px; transition:opacity .6s; }
  .kf-k { color:#ff9a4d; font-weight:900; } .kf-v { color:#7fb8e8; font-weight:900; } .kf-w { color:#cbb98f; font-size:11px; margin:0 6px; }
  /* radio */
  .radio { position:absolute; left:12px; top:230px; display:flex; flex-direction:column; gap:5px; max-width:340px; }
  .rd { background:rgba(12,14,18,.72); border-left:3px solid #ffb224; padding:6px 10px; font-size:13px; border-radius:2px; transition:opacity .6s; }
  .rd b { color:#ffb224; font-size:11px; letter-spacing:1px; margin-right:6px; }
  .threat { position:absolute; left:50%; top:120px; transform:translateX(-50%); background:rgba(120,20,10,.8); padding:5px 14px; font-size:12px; font-weight:700; letter-spacing:1px; border-radius:3px; opacity:0; transition:opacity .3s; }
  /* crosshair */
  .crosshair { position:absolute; left:50%; top:50%; width:0; height:0; }
  .ch { position:absolute; background:#e8f0ff; box-shadow:0 0 3px #000; }
  .ch.t { left:-1px; top:calc(-11px - var(--ch)); width:2px; height:8px; }
  .ch.b { left:-1px; top:calc(3px + var(--ch)); width:2px; height:8px; }
  .ch.l { top:-1px; left:calc(-11px - var(--ch)); width:8px; height:2px; }
  .ch.r { top:-1px; left:calc(3px + var(--ch)); width:8px; height:2px; }
  .ch.dot { left:-1px; top:-1px; width:2px; height:2px; }
  .hitmarker { position:absolute; left:50%; top:50%; width:0; height:0; opacity:0; }
  .hitmarker i { position:absolute; width:11px; height:2px; background:#fff; box-shadow:0 0 4px #000; }
  .hitmarker i:nth-child(1){ transform:translate(-14px,-10px) rotate(45deg); }
  .hitmarker i:nth-child(2){ transform:translate(3px,-10px) rotate(-45deg); }
  .hitmarker i:nth-child(3){ transform:translate(-14px,8px) rotate(-45deg); }
  .hitmarker i:nth-child(4){ transform:translate(3px,8px) rotate(45deg); }
  .hitmarker.show { opacity:1; } .hitmarker.hs i { background:#ff5a3c; }
  .dmg { position:absolute; left:50%; top:50%; width:220px; height:220px; margin:-110px 0 0 -110px; opacity:0;
    background:radial-gradient(circle at 50% 0%, rgba(255,40,20,.55) 0%, transparent 32%); transform:rotate(var(--rot,0deg)); }
  .dmg.show { opacity:1; }
  /* banner */
  .banner { position:absolute; left:50%; top:22%; transform:translateX(-50%) scale(.96); text-align:center; opacity:0; transition:all .3s; }
  .banner.show { opacity:1; transform:translateX(-50%) scale(1); }
  .bn-main { font-size:30px; font-weight:900; letter-spacing:2px; text-shadow:0 2px 12px #000; }
  .bn-sub { font-size:14px; color:#ffd23e; text-shadow:0 1px 6px #000; margin-top:4px; }
  /* bottom left vitals */
  .bl { position:absolute; left:14px; bottom:14px; display:flex; gap:10px; }
  .stat { background:rgba(12,14,18,.78); border:1px solid rgba(255,255,255,.14); padding:7px 12px; border-radius:4px; min-width:96px; }
  .stat label { font-size:9px; letter-spacing:2px; color:#b8ac93; display:block; }
  .stat b { font-size:24px; font-weight:900; }
  .stat .bar { height:5px; background:rgba(255,255,255,.15); margin-top:4px; border-radius:2px; overflow:hidden; }
  .stat .bar i { display:block; height:100%; background:#7ee787; width:100%; }
  .stat.cash b { color:#ffd23e; }
  /* bottom right weapon */
  .br { position:absolute; right:14px; bottom:14px; text-align:right; background:rgba(12,14,18,.78); border:1px solid rgba(255,255,255,.14); padding:8px 14px; border-radius:4px; }
  .wname { font-size:12px; letter-spacing:2px; color:#cbb98f; font-weight:700; }
  .ammo b { font-size:34px; font-weight:900; } .ammo span { font-size:16px; color:#9a938a; }
  .slots, .nades { font-size:11px; margin-top:3px; color:#b8ac93; }
  .slots span, .nades span { background:rgba(255,255,255,.08); padding:2px 6px; border-radius:2px; margin-left:4px; }
  .slots span.cur { background:#ffb224; color:#111; font-weight:900; }
  /* buy menu */
  .buy { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:620px; background:rgba(10,12,16,.92); border:1px solid #ffb224; border-radius:6px; padding:18px; pointer-events:auto; }
  .buy-title { font-size:16px; font-weight:900; letter-spacing:1px; margin-bottom:12px; }
  .buy-title b { color:#ffd23e; }
  .buy-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .buy-item { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.14); padding:10px; border-radius:4px; cursor:pointer; display:grid; grid-template-columns:22px 1fr auto; gap:4px 8px; }
  .buy-item:hover { border-color:#ffb224; background:rgba(255,178,36,.14); }
  .buy-item b { font-size:18px; color:#ffb224; }
  .bi-n { font-weight:900; font-size:14px; } .bi-p { color:#ffd23e; font-weight:900; }
  .bi-d { grid-column:2/4; font-size:11px; color:#9a938a; }
  .buy-hint { margin-top:12px; font-size:11px; color:#9a938a; }
  /* scoreboard */
  .score { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:640px; background:rgba(10,12,16,.94); border:1px solid rgba(255,255,255,.2); border-radius:6px; padding:18px; }
  .sc-title { font-size:15px; font-weight:900; letter-spacing:1px; margin-bottom:10px; color:#ffd23e; }
  .score table { width:100%; border-collapse:collapse; font-size:14px; }
  .score th { text-align:left; color:#9a938a; font-size:11px; letter-spacing:1px; padding:4px 8px; border-bottom:1px solid rgba(255,255,255,.2); }
  .score td { padding:5px 8px; border-bottom:1px solid rgba(255,255,255,.06); }
  .score tr.you td { color:#ffd23e; font-weight:900; }
  .score tr.ember td:first-child { color:#ff9a4d; } .score tr.slate td:first-child { color:#7fb8e8; }
  .score tr.sep td { color:#9a938a; font-size:11px; letter-spacing:2px; padding-top:10px; }
  /* menu */
  .menu { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(8,6,4,.55); pointer-events:auto; }
  .menu-card { text-align:center; background:rgba(10,12,16,.88); border:1px solid rgba(255,255,255,.18); border-radius:8px; padding:34px 44px; max-width:560px; }
  .menu-kicker { font-size:11px; letter-spacing:3px; color:#ffb224; font-weight:700; }
  .menu-card h1 { font-size:52px; line-height:.95; font-weight:900; letter-spacing:2px; margin:10px 0; }
  .menu-sub { color:#cbb98f; margin-bottom:14px; }
  .menu-teams { display:flex; gap:14px; justify-content:center; font-weight:900; margin-bottom:18px; }
  .menu-teams .ember { color:#ff9a4d; } .menu-teams .slate { color:#7fb8e8; } .vs { color:#9a938a; }
  #startBtn { font-size:18px; font-weight:900; letter-spacing:1px; padding:14px 30px; background:#ffb224; color:#14100a; border:0; border-radius:5px; cursor:pointer; }
  #startBtn:hover { background:#ffd23e; }
  .menu-controls { font-size:12px; color:#9a938a; margin-top:16px; line-height:1.7; }
  .menu-sens { display:block; margin-top:12px; font-size:12px; color:#cbb98f; }
  /* end */
  .end { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(8,6,4,.6); pointer-events:auto; }
  .end-card { text-align:center; background:rgba(10,12,16,.92); border:1px solid rgba(255,255,255,.2); border-radius:8px; padding:30px 44px; }
  .end-card h2 { font-size:34px; margin-bottom:8px; }
  .end-card button { margin-top:16px; font-size:15px; font-weight:900; padding:10px 22px; background:#ffb224; border:0; border-radius:5px; cursor:pointer; }
  /* plant bar */
  .plantbar { position:absolute; left:50%; top:62%; transform:translateX(-50%); width:280px; text-align:center; }
  .pb-label { font-size:12px; letter-spacing:2px; color:#ffd23e; font-weight:900; margin-bottom:5px; text-shadow:0 1px 4px #000; }
  .pb-track { height:8px; background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.3); border-radius:4px; overflow:hidden; }
  .pb-track i { display:block; height:100%; background:#ffb224; width:0%; }
</style>
